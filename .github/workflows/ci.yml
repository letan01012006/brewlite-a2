name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://brewlite:brewlite@127.0.0.1:5432/brewlite
      TEST_DATABASE_URL: postgresql://brewlite:brewlite@127.0.0.1:5432/brewlite_test
      JWT_SECRET: brewlite-ci-jwt-key-only-for-disposable-tests
      OTP_HASH_SECRET: brewlite-ci-otp-key-only-for-disposable-tests
      SMS_PROVIDER: local
      AUTH_OTP_DEMO: 'true'
      PAYMENT_MOCK_ENABLED: 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite -d brewlite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Prepare PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U brewlite brewlite_test
          npx --no-install prisma generate
          npx --no-install prisma migrate deploy
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Start and seed the test stack
        run: |
          cat > apps/api/.env <<'ENV'
          NODE_ENV=development
          DATABASE_URL=postgresql://brewlite:brewlite@db:5432/brewlite
          JWT_SECRET=brewlite-ci-jwt-key-only-for-disposable-tests
          OTP_HASH_SECRET=brewlite-ci-otp-key-only-for-disposable-tests
          SMS_PROVIDER=local
          AUTH_OTP_DEMO=true
          PAYMENT_MOCK_ENABLED=true
          ENV
          docker compose up --build --wait --wait-timeout 180
          docker compose exec -T backend npx --no-install prisma db seed
      - name: Check the web, menu and a mock checkout
        run: |
          node tests/checkout-smoke.mjs
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove the disposable CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans
